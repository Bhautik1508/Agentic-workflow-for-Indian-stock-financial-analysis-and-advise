name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches runtime.txt and render.yaml. The repo's own venv was 3.9,
          # which is how a Python-version-specific asyncio bug stayed hidden.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        # Dummy keys so provider construction succeeds. No test may make a real
        # network call; if one starts to, it will fail here rather than in prod.
        env:
          GROQ_API_KEY: test_key_for_ci
          GOOGLE_API_KEY: test_key_for_ci
          LLM_STARTUP_CHECK: "0"
        run: python -m pytest -q

  coverage:
    name: Fundamentals coverage
    runs-on: ubuntu-latest
    # Informational: upstream sources are flaky and a transient Screener outage
    # must not fail an unrelated PR. It surfaces a regression without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python scripts/check_coverage.py --limit 4

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.6+ required: `npm test` runs node --experimental-strip-types,
          # which does not exist on 20. CI on 20 failed while local (25.x)
          # passed — the requirement is now declared in package.json engines.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # gitleaks needs history, not just the tip

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
