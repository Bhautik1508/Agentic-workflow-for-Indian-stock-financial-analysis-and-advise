name: Nightly evaluation

# Opt-in, not automatic on push. Two reasons:
#   * the golden set is ~18 full analyses (~108 LLM calls) and spends real quota;
#   * it needs live API keys, which a fork's PR must never be handed.
#
# Enable the schedule once GEMINI/GROQ keys exist as repository secrets.
on:
  workflow_dispatch:
    inputs:
      run_golden_set:
        description: "Also run the golden set (costs LLM quota)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "30 1 * * *"   # 07:00 IST

jobs:
  coverage:
    name: Fundamentals coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # No LLM calls — this is the cheap check, safe to run often. It catches a
      # Screener label change or a broken selector before a verdict is wrong.
      - name: Check fundamentals coverage
        run: python scripts/check_coverage.py

  backtest:
    name: Backtest existing run logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # Reports per engine cohort and never pools them. Informational: it exits
      # 0 even on a poor hit-rate, because the sample is not yet evidence.
      - name: Score past verdicts
        run: python scripts/backtest.py || true

  golden-set:
    name: Golden set (manual)
    if: ${{ inputs.run_golden_set }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Run golden set
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/run_golden_set.py
